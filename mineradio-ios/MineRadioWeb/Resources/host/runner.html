<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mineradio Bridge Host</title>
  </head>
  <body>
    <script>
      (function () {
        var EXT_ID = 'mineradio-ios';
        var VERSION = '1.4.2';
        var storageMem = null;
        var dnrCookieRules = [];
        var pendingHttp = {};

        /* ------------------------------------------------------------------
         * iOS host bridge. WKWebView message handlers are async, but the
         * shared `chrome.*` polyfills below expect synchronous returns from
         * getCookie() / storageGetAll(). We solve this by keeping a JS-side
         * mirror of the cookie jar + storage that native proactively syncs
         * (window.__mineradioCookieSync / __mineradioStorageSync). Side-effect
         * calls (setCookie / storageSet / startHttp) are fire-and-forget via
         * postMessage and also update the mirror optimistically.
         * ------------------------------------------------------------------ */
        window.__mineradioCookies = window.__mineradioCookies || [];
        window.__mineradioStorage = window.__mineradioStorage || {};

        window.__mineradioCookieSync = function (list) {
          window.__mineradioCookies = list || [];
        };
        window.__mineradioStorageSync = function (obj) {
          window.__mineradioStorage = obj || {};
        };

        window.__nativeHttpResult = function (id, raw) {
          var pending = pendingHttp[id];
          if (!pending) return;
          delete pendingHttp[id];
          try {
            pending.resolve(typeof raw === 'string' ? JSON.parse(raw) : raw);
          } catch (err) {
            pending.reject(err);
          }
        };

        window.__mineradioPostApiResult = function (id, json) {
          postToNative({ op: 'apiResult', id: id, json: json });
        };

        function postToNative(msg) {
          try {
            window.webkit.messageHandlers.MineradioHost.postMessage(msg);
          } catch (_) {}
        }

        function cookiesForUrl(url) {
          try {
            var u = new URL(url);
            var host = (u.hostname || '').toLowerCase();
            var path = u.pathname || '/';
            if (path === '') path = '/';
            var secure = u.protocol === 'https:';
            var picked = {};
            (window.__mineradioCookies || []).forEach(function (c) {
              if (!c || !c.name || c.value == null) return;
              var cd = String(c.domain || '').toLowerCase();
              var stripped = cd.replace(/^\./, '');
              var domainMatch = !stripped || host === stripped || host.endsWith('.' + stripped);
              if (!domainMatch) return;
              var cp = c.path && c.path !== '' ? c.path : '/';
              var pathMatch = path.indexOf(cp) === 0 || cp === '/';
              if (!pathMatch) return;
              if (c.secure && !secure) return;
              if (picked[c.name] == null) picked[c.name] = c.value;
            });
            return Object.keys(picked)
              .map(function (k) { return k + '=' + picked[k]; })
              .join('; ');
          } catch (_) {
            return '';
          }
        }

        var MineradioHost = {
          getCookie: function (url) { return cookiesForUrl(url); },
          setCookie: function (url, cookie) {
            postToNative({ op: 'setCookie', url: url, cookie: cookie });
          },
          storageGetAll: function () { return JSON.stringify(window.__mineradioStorage); },
          storageSet: function (key, value) {
            window.__mineradioStorage[key] = value;
            postToNative({ op: 'storageSet', key: key, value: value });
          },
          startHttp: function (id, spec) {
            postToNative({ op: 'startHttp', id: id, spec: spec });
          },
          readAssetText: function () { return ''; },
        };
        window.MineradioHost = MineradioHost;

        /* ---------------- chrome.* polyfills (shared logic) ---------------- */

        function parseCookieHeader(header) {
          var out = [];
          if (!header) return out;
          String(header)
            .split(';')
            .forEach(function (part) {
              var idx = part.indexOf('=');
              if (idx <= 0) return;
              var name = part.slice(0, idx).trim();
              var value = part.slice(idx + 1).trim();
              if (!name) return;
              out.push({ name: name, value: value });
            });
          return out;
        }

        function domainUrls(domain) {
          var d = String(domain || '')
            .replace(/^\./, '')
            .toLowerCase();
          if (!d) return [];
          if (d.indexOf('163.com') >= 0 || d.indexOf('126.net') >= 0) {
            return [
              'https://music.163.com/',
              'https://www.music.163.com/',
              'https://interface.music.163.com/',
              'https://interface3.music.163.com/',
            ];
          }
          if (d.indexOf('qq.com') >= 0 || d.indexOf('tencent.com') >= 0) {
            return [
              'https://y.qq.com/',
              'https://i.y.qq.com/',
              'https://u.y.qq.com/',
              'https://graph.qq.com/',
              'https://qq.com/',
              'https://ssl.ptlogin2.qq.com/',
            ];
          }
          if (d.indexOf('kugou') >= 0) {
            return ['https://www.kugou.com/', 'https://kugou.com/', 'https://m.kugou.com/'];
          }
          return ['https://' + d + '/', 'https://www.' + d + '/'];
        }

        async function getAllCookies(query) {
          query = query || {};
          var map = {};
          function merge(list, url) {
            (list || []).forEach(function (c) {
              map[c.name] = Object.assign({ url: url }, c);
            });
          }
          if (query.url) {
            merge(parseCookieHeader(MineradioHost.getCookie(query.url)), query.url);
          } else if (query.domain) {
            domainUrls(query.domain).forEach(function (url) {
              merge(parseCookieHeader(MineradioHost.getCookie(url)), url);
            });
          }
          var list = Object.keys(map).map(function (k) {
            return map[k];
          });
          if (query.name) list = list.filter(function (c) {
            return c.name === query.name;
          });
          return list;
        }

        function hydrateStorageValue(raw) {
          if (raw == null || raw === '') return raw;
          if (typeof raw !== 'string') return raw;
          try {
            return JSON.parse(raw);
          } catch (_) {
            return raw;
          }
        }

        function loadStorageMem() {
          if (storageMem) return storageMem;
          storageMem = {};
          try {
            var all = JSON.parse(MineradioHost.storageGetAll() || '{}');
            Object.keys(all || {}).forEach(function (k) {
              if (all[k] === '') return;
              storageMem[k] = hydrateStorageValue(all[k]);
            });
          } catch (_) {}
          return storageMem;
        }

        function urlFilterMatch(url, filter) {
          if (!filter) return true;
          var f = String(filter);
          if (f.indexOf('||') === 0) return String(url).indexOf(f.slice(2)) >= 0;
          return String(url).indexOf(f) >= 0;
        }

        function abToBase64(buffer) {
          var bytes = new Uint8Array(buffer);
          var binary = '';
          var chunk = 0x8000;
          for (var i = 0; i < bytes.length; i += chunk) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
          }
          return btoa(binary);
        }

        function base64ToBytes(b64) {
          var bin = atob(String(b64 || ''));
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          return bytes;
        }

        window.chrome = {
          runtime: {
            id: EXT_ID,
            lastError: null,
            getManifest: function () {
              return { manifest_version: 3, name: 'Mineradio Bridge', version: VERSION };
            },
          },
          cookies: {
            getAll: function (query) {
              return getAllCookies(query);
            },
            get: async function (details) {
              var all = await getAllCookies({ url: details.url, name: details.name });
              return all[0] || null;
            },
            set: async function (details) {
              var parts = [details.name + '=' + details.value, 'path=' + (details.path || '/')];
              if (details.domain) parts.push('domain=' + details.domain);
              if (details.secure !== false) parts.push('Secure');
              if (details.expirationDate) {
                parts.push('expires=' + new Date(details.expirationDate * 1000).toUTCString());
              }
              MineradioHost.setCookie(details.url, parts.join('; '));
              return details;
            },
            remove: async function (details) {
              MineradioHost.setCookie(
                details.url,
                details.name + '=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT'
              );
            },
          },
          storage: {
            local: {
              get: async function (keys) {
                var mem = loadStorageMem();
                if (keys == null) return Object.assign({}, mem);
                var list = Array.isArray(keys) ? keys : [keys];
                var out = {};
                list.forEach(function (k) {
                  if (Object.prototype.hasOwnProperty.call(mem, k)) out[k] = mem[k];
                });
                return out;
              },
              set: async function (items) {
                var mem = loadStorageMem();
                Object.keys(items || {}).forEach(function (k) {
                  mem[k] = items[k];
                  try {
                    MineradioHost.storageSet(k, JSON.stringify(items[k]));
                  } catch (_) {}
                });
              },
              remove: async function (keys) {
                var mem = loadStorageMem();
                var list = Array.isArray(keys) ? keys : [keys];
                list.forEach(function (k) {
                  delete mem[k];
                  MineradioHost.storageSet(k, '');
                });
              },
            },
          },
          declarativeNetRequest: {
            updateSessionRules: async function (opts) {
              opts = opts || {};
              if (opts.addRules && opts.addRules.length) {
                dnrCookieRules = [];
                opts.addRules.forEach(function (rule) {
                  var cookieHdr = (rule.action && rule.action.requestHeaders || []).find(function (h) {
                    return String(h.header || '').toLowerCase() === 'cookie';
                  });
                  if (cookieHdr && cookieHdr.value) {
                    dnrCookieRules.push({
                      filter: rule.condition && rule.condition.urlFilter,
                      cookie: cookieHdr.value,
                    });
                  }
                });
                return;
              }
              if (opts.removeRuleIds && opts.removeRuleIds.length) {
                dnrCookieRules = [];
              }
            },
          },
          tabs: {
            query: async function () {
              return [];
            },
            onUpdated: { addListener: function () {} },
            onRemoved: { addListener: function () {} },
          },
          scripting: {
            executeScript: async function () {
              return [];
            },
          },
        };

        // Privileged fetch: can set Cookie + read Set-Cookie (required for QQ QR login).
        window.fetch = async function (input, init) {
          init = init || {};
          var url = typeof input === 'string' ? input : input && input.url;
          if (!url) throw new Error('fetch missing url');
          var method = String(init.method || 'GET').toUpperCase();
          var headers = {};
          try {
            new Headers(init.headers || {}).forEach(function (v, k) {
              headers[k] = v;
            });
          } catch (_) {
            var plain = init.headers || {};
            Object.keys(plain).forEach(function (k) {
              headers[k] = plain[k];
            });
          }

          for (var i = 0; i < dnrCookieRules.length; i++) {
            var rule = dnrCookieRules[i];
            if (urlFilterMatch(url, rule.filter) && rule.cookie) {
              headers.Cookie = rule.cookie;
              break;
            }
          }

          var body = '';
          var bodyBase64 = '';
          if (init.body != null) {
            if (typeof init.body === 'string') body = init.body;
            else if (init.body instanceof ArrayBuffer) bodyBase64 = abToBase64(init.body);
            else if (ArrayBuffer.isView(init.body)) {
              bodyBase64 = abToBase64(
                init.body.buffer.slice(init.body.byteOffset, init.body.byteOffset + init.body.byteLength)
              );
            } else if (typeof URLSearchParams !== 'undefined' && init.body instanceof URLSearchParams) {
              body = init.body.toString();
              if (!headers['Content-Type'] && !headers['content-type']) {
                headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8';
              }
            } else {
              body = String(init.body);
            }
          }

          var id = 'h' + Date.now() + '_' + Math.random().toString(16).slice(2);
          var result = await new Promise(function (resolve, reject) {
            pendingHttp[id] = { resolve: resolve, reject: reject };
            try {
              MineradioHost.startHttp(
                id,
                JSON.stringify({
                  url: url,
                  method: method,
                  headers: headers,
                  body: body,
                  bodyBase64: bodyBase64,
                  redirect: init.redirect !== 'manual',
                })
              );
            } catch (err) {
              delete pendingHttp[id];
              reject(err);
              return;
            }
            setTimeout(function () {
              if (pendingHttp[id]) {
                delete pendingHttp[id];
                reject(new Error('native http timeout'));
              }
            }, 35000);
          });

          if (!result || result.ok === false) {
            throw new Error((result && result.error) || 'native http failed');
          }

          var bytes = base64ToBytes(result.bodyBase64 || '');
          var setCookies = result.setCookies || [];
          var headerInit = result.headers || {};
          var respHeaders = new Headers();
          Object.keys(headerInit).forEach(function (k) {
            try {
              respHeaders.set(k, headerInit[k]);
            } catch (_) {}
          });

          var response = new Response(bytes, {
            status: result.status || 200,
            statusText: 'OK',
            headers: respHeaders,
          });

          // Bridge QQ login reads Set-Cookie via headers.getSetCookie().
          try {
            response.headers.getSetCookie = function () {
              return setCookies.slice();
            };
          } catch (_) {
            Object.defineProperty(response, 'headers', {
              value: {
                get: function (name) {
                  return respHeaders.get(name);
                },
                getSetCookie: function () {
                  return setCookies.slice();
                },
              },
            });
          }

          return response;
        };

        window.__bridgeVersion = VERSION;
        window.__bridgeExtId = EXT_ID;

        window.__serializeApiResult = function (data) {
          if (data && data.__binary && data.buffer) {
            var buf = data.buffer;
            if (!(buf instanceof ArrayBuffer) && ArrayBuffer.isView(buf)) {
              buf = buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength);
            }
            if (buf instanceof ArrayBuffer) {
              data = Object.assign({}, data, { base64: abToBase64(buf) });
              delete data.buffer;
            }
          }
          return data;
        };
      })();
    </script>
    <script type="module">
      import { handleApiRequest, getBridgeStatus } from '../bridge/api/router.js';

      window.__handleApi = async function (payload) {
        const data = await handleApiRequest(payload || {});
        return window.__serializeApiResult(data);
      };
      window.__getBridgeStatus = getBridgeStatus;
      window.__mineradioBridgeHostReady = true;

      try {
        const mod = await import('../bridge/api/kugou.js');
        if (mod.ensureKGCookie) mod.ensureKGCookie().catch(() => {});
      } catch (_) {}
    </script>
  </body>
</html>
